[build-system]
requires = ["setuptools>=68", "setuptools-scm"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "fireviz"
version = "0.1.0"
description = "FIRE-VIZ: 3D Surface & Understory Fuels Characterization Pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "rioxarray>=0.15",
    "rasterio>=1.3",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "geopandas>=1.1.2",
    "shapely>=2.0",
    "pyvista>=0.42",
]

[project.optional-dependencies]
lidar = ["pdal"]
fastfuels = ["fastfuels-sdk"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
fireviz-viz = "fireviz.viz.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fireviz*"]
